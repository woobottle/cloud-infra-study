# .github/workflows/ci.yaml
name: CI - Build and Push to ECR

on:
  push:
    branches: [step6/gitops]
    paths:
      - "app/**"

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: cloud-infra-lab/next-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd app
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Helm values with new image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s/tag: .*/tag: $IMAGE_TAG/" helm/next-app/values.yaml

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/next-app/values.yaml
          git commit -m "chore: update next-app image tag to ${{ github.sha }}"
          git push